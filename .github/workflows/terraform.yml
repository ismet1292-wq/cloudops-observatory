name: Validate Terraform

on:
  push:
    paths:
      - 'terraform/**'
      - 'infrastructure/aws-network/**'
      - 'infrastructure/aws-host/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - 'infrastructure/aws-network/**'
      - 'infrastructure/aws-host/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        directory: [terraform, infrastructure/aws-network, infrastructure/aws-host]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Check bootstrap shell syntax
        if: matrix.directory == 'infrastructure/aws-host'
        run: bash -n bootstrap.sh.tftpl

      - name: Test host safeguards with a mocked AWS provider
        if: matrix.directory == 'infrastructure/aws-host'
        run: terraform test -no-color